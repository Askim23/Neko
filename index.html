.ab{position:relative;width:118px;height:84px}

.ab [data-k=B]{left:6px;top:30px}
.ab [data-k=A]{left:62px;top:8px}

.ss{display:flex;gap:18px;margin-top:2px}
.ss b{position:static;width:44px;height:12px;line-height:12px;border-radius:6px;font-size:6px;transform:rotate(-20deg)}

/* ================= Décors en pixel art (80x48) ================= */

function tod() { const h = new Date().getHours(); return P().asleep || h >= 21 || h < 5 ? "night" : h >= 7 && h < 18 ? "day" : "dusk"; }
